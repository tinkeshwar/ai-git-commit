name: Mirror to GitHub

on:
  push:
    branches: ['**']
    tags: ['**']

jobs:
  mirror:
    runs-on: docker
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Push to GitHub
        env:
          GH_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
        run: git push --force "https://x-access-token:${GH_TOKEN}@github.com/tinkeshwar/git-tool.git" "HEAD:${{ github.ref }}"
