name: Mirror to GitHub

on:
  push:
    branches: ['**']
    tags: ['**']

jobs:
  mirror:
    runs-on: docker
    container:
      image: node:24-bookworm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # bump version + CHANGELOG from conventional commits, tag vX.Y.Z; skip our own release commit to avoid a loop
      - name: Release
        if: github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore(release)')
        run: |
          git config user.name "forgejo-actions"
          git config user.email "actions@git.tinkeshwar.in"
          npx --yes commit-and-tag-version@13
          git push --follow-tags origin HEAD:main
      - name: Push to GitHub
        env:
          GH_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
        run: git push --force --follow-tags "https://x-access-token:${GH_TOKEN}@github.com/tinkeshwar/ai-git-commit.git" "HEAD:${{ github.ref }}"
